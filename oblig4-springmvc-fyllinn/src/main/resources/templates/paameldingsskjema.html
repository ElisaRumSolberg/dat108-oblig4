<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="css/simple.css" rel="stylesheet" type="text/css" />
    <title>Påmelding</title>
</head>

<body>

<h2>Påmelding</h2>

<p style="color:red;" th:text="${melding}"></p>

<form method="post">
    <fieldset>

        <label>Fornavn</label>
        <input type="text"
               name="fornavn"
               th:value="${deltager?.fornavn}" />

        <label>Etternavn</label>
        <input type="text"
               name="etternavn"
               th:value="${deltager?.etternavn}" />

        <label>Mobil (8 siffer)</label>
        <input type="text"
               name="mobil"
               th:value="${deltager?.mobil}" />

        <label>Passord</label>
        <input type="password"
               name="passord" />

        <label>Passord repetert</label>
        <input type="password"
               name="passordRepetert" />

        <label>Kjønn</label>

        <input type="radio"
               name="kjonn"
               value="mann"
               checked="checked" />
        mann

        <input type="radio"
               name="kjonn"
               value="kvinne" />
        kvinne

        <br><br>

        <button type="submit">Meld meg på</button>

    </fieldset>
</form>

</body>
</html>
